<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>今日 AI 新聞專刊</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#0F3B82',
              dark: '#0A2550',
              accent: '#2563EB',
              light: '#EFF6FF'
            }
          },
          fontFamily: {
            sans: ['"Microsoft JhengHei"', '微軟正黑體', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      font-family: "Microsoft JhengHei", "微軟正黑體", system-ui, sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- 頂部導航欄 (Fixed Header) -->
  <header class="sticky top-0 z-40 bg-[#0F3B82] text-white shadow-md">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="bg-blue-600 p-1.5 rounded-lg flex items-center justify-center">
          <i data-lucide="newspaper" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <h1 class="text-base font-bold tracking-tight">AI 產業情報專刊</h1>
          <p id="current-date" class="text-xs text-blue-200">讀取中...</p>
        </div>
      </div>
      
      <!-- 個人關鍵字設定按鈕 -->
      <button id="open-settings-btn" class="flex items-center space-x-1 bg-white/10 hover:bg-white/20 active:scale-95 transition px-3 py-1.5 rounded-full text-xs font-medium backdrop-blur-sm border border-white/20">
        <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5"></i>
        <span>設定主題</span>
      </button>
    </div>
  </header>

  <!-- 主內容容器 -->
  <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-4">
    
    <!-- 使用者歡迎卡與關鍵字 Tag 區 -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex flex-col space-y-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2.5">
          <img id="user-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80" alt="Avatar" class="w-9 h-9 rounded-full ring-2 ring-blue-500/30 object-cover">
          <div>
            <div class="flex items-center space-x-1.5">
              <span id="user-name" class="font-bold text-sm text-slate-900">訪客 (預覽模式)</span>
              <span id="user-badge" class="bg-blue-100 text-blue-700 text-[10px] px-1.5 py-0.5 rounded font-medium">專屬日報</span>
            </div>
            <p id="status-text" class="text-[11px] text-slate-400">已啟用每日自動客製化摘要</p>
          </div>
        </div>
        
        <!-- 立即更新按鈕 -->
        <button id="instant-update-btn" class="flex items-center space-x-1.5 bg-blue-50 hover:bg-blue-100 active:scale-95 text-[#0F3B82] px-3 py-1.5 rounded-xl text-xs font-bold border border-blue-200 transition shadow-sm">
          <i data-lucide="zap" class="w-3.5 h-3.5 text-blue-600 fill-blue-600"></i>
          <span>立即更新</span>
        </button>
      </div>

      <!-- 目前追蹤關鍵字與時間 Badge -->
      <div class="pt-2 border-t border-slate-100 flex flex-col space-y-2">
        <div class="flex items-center justify-between text-[11px] text-slate-500 font-medium">
          <span class="flex items-center gap-1">
            <i data-lucide="tag" class="w-3 h-3 text-blue-600"></i>
            目前追蹤主題：
          </span>
          <span id="push-time-badge" class="flex items-center gap-1 text-blue-700 bg-blue-50 px-2 py-0.5 rounded-md font-semibold">
            <i data-lucide="clock" class="w-3 h-3 text-blue-600"></i>
            每日 <span id="display-push-time">08:00</span> 更新
          </span>
        </div>
        <div id="keywords-tags" class="flex flex-wrap gap-1.5">
          <span class="bg-slate-100 text-slate-600 text-xs px-2.5 py-1 rounded-md">載入中...</span>
        </div>
      </div>
    </div>

    <!-- 載入中骨架屏 (Skeleton Loading) -->
    <div id="loading-skeleton" class="space-y-4">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 animate-pulse space-y-3">
        <div class="h-4 bg-slate-200 rounded w-1/3"></div>
        <div class="h-5 bg-slate-200 rounded w-4/5"></div>
        <div class="h-16 bg-blue-50 rounded"></div>
        <div class="h-10 bg-slate-100 rounded"></div>
      </div>
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 animate-pulse space-y-3">
        <div class="h-4 bg-slate-200 rounded w-1/4"></div>
        <div class="h-5 bg-slate-200 rounded w-3/4"></div>
        <div class="h-16 bg-blue-50 rounded"></div>
        <div class="h-10 bg-slate-100 rounded"></div>
      </div>
    </div>

    <!-- 新聞卡片列表容器 -->
    <div id="news-list" class="space-y-4 hidden"></div>

    <!-- 無新聞狀態 -->
    <div id="empty-state" class="hidden bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-center space-y-3">
      <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto">
        <i data-lucide="inbox" class="w-6 h-6"></i>
      </div>
      <h3 class="font-bold text-slate-800 text-sm">今日尚無相關主題新訊</h3>
      <p class="text-xs text-slate-500">建議點選右上角「設定主題」加入更廣泛的關鍵字。</p>
    </div>

  </main>

  <!-- 關鍵字設定抽屜 / 彈窗 (Modal Drawer) -->
  <div id="settings-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 space-y-4 shadow-xl transform transition-transform">
      <div class="flex items-center justify-between border-b pb-3">
        <div class="flex items-center space-x-2">
          <i data-lucide="settings" class="w-5 h-5 text-blue-600"></i>
          <h3 class="font-bold text-base text-slate-900">設定專屬關注主題</h3>
        </div>
        <button id="close-modal-btn" class="text-slate-400 hover:text-slate-600 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <p class="text-xs text-slate-500">
        AI 會在每天清晨根據您勾選或自訂的關鍵字，自動爬取最新資訊並提煉產業摘要。
      </p>

      <!-- 快速熱門標籤 -->
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-2">🔥 推薦熱門標籤（點擊加入）：</label>
        <div class="flex flex-wrap gap-2">
          <button type="button" class="preset-tag bg-slate-100 hover:bg-blue-50 hover:text-blue-600 text-xs px-2.5 py-1.5 rounded-lg border border-slate-200 transition" data-tag="具身機器人">+ 具身機器人</button>
          <button type="button" class="preset-tag bg-slate-100 hover:bg-blue-50 hover:text-blue-600 text-xs px-2.5 py-1.5 rounded-lg border border-slate-200 transition" data-tag="製造業 AI">+ 製造業 AI</button>
          <button type="button" class="preset-tag bg-slate-100 hover:bg-blue-50 hover:text-blue-600 text-xs px-2.5 py-1.5 rounded-lg border border-slate-200 transition" data-tag="智慧工廠">+ 智慧工廠</button>
          <button type="button" class="preset-tag bg-slate-100 hover:bg-blue-50 hover:text-blue-600 text-xs px-2.5 py-1.5 rounded-lg border border-slate-200 transition" data-tag="AOI 瑕疵檢測">+ AOI 瑕疵檢測</button>
          <button type="button" class="preset-tag bg-slate-100 hover:bg-blue-50 hover:text-blue-600 text-xs px-2.5 py-1.5 rounded-lg border border-slate-200 transition" data-tag="台積電 CoWoS">+ 台積電 CoWoS</button>
          <button type="button" class="preset-tag bg-slate-100 hover:bg-blue-50 hover:text-blue-600 text-xs px-2.5 py-1.5 rounded-lg border border-slate-200 transition" data-tag="邊緣運算">+ 邊緣運算</button>
        </div>
      </div>

      <!-- 自訂關鍵字輸入框 -->
      <div>
        <label for="custom-keywords" class="block text-xs font-bold text-slate-700 mb-1.5">我的追蹤關鍵字（用逗號分開）：</label>
        <textarea id="custom-keywords" rows="2" class="w-full text-sm p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="例如：具身機器人, 製造業 AI, 智慧自動化"></textarea>
      </div>

      <!-- 每日推送/更新時間設定 -->
      <div class="pt-2 border-t border-slate-100 space-y-2">
        <div class="flex items-center justify-between">
          <label class="block text-xs font-bold text-slate-700 flex items-center gap-1.5">
            <i data-lucide="clock" class="w-4 h-4 text-blue-600"></i>
            <span>⏰ 每日更新 / 推送時間：</span>
          </label>
          <div class="flex items-center space-x-1">
            <input type="time" id="custom-push-time" value="08:00" class="text-xs font-bold text-blue-900 bg-blue-50 border border-blue-200 rounded-lg px-2 py-1 outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>
        
        <!-- 常用快捷時間標籤 -->
        <div class="flex flex-wrap gap-1.5">
          <button type="button" class="time-preset-tag bg-slate-100 hover:bg-blue-50 hover:text-blue-600 text-[11px] px-2.5 py-1 rounded-md border border-slate-200 transition font-medium" data-time="07:00">07:00 晨報</button>
          <button type="button" class="time-preset-tag bg-blue-100 text-blue-700 text-[11px] px-2.5 py-1 rounded-md border border-blue-300 transition font-bold" data-time="08:00">08:00 上班首選</button>
          <button type="button" class="time-preset-tag bg-slate-100 hover:bg-blue-50 hover:text-blue-600 text-[11px] px-2.5 py-1 rounded-md border border-slate-200 transition font-medium" data-time="09:00">09:00 開工特刊</button>
          <button type="button" class="time-preset-tag bg-slate-100 hover:bg-blue-50 hover:text-blue-600 text-[11px] px-2.5 py-1 rounded-md border border-slate-200 transition font-medium" data-time="12:30">12:30 午間特刊</button>
          <button type="button" class="time-preset-tag bg-slate-100 hover:bg-blue-50 hover:text-blue-600 text-[11px] px-2.5 py-1 rounded-md border border-slate-200 transition font-medium" data-time="18:00">18:00 傍晚盤點</button>
        </div>
      </div>

      <!-- 操作按鈕群 -->
      <div class="pt-2 flex flex-col space-y-2">
        <button id="save-and-refresh-btn" class="w-full bg-[#0F3B82] hover:bg-blue-700 active:scale-[0.98] text-white font-bold py-3 rounded-xl shadow-md transition flex items-center justify-center space-x-2 text-sm">
          <i data-lucide="zap" class="w-4 h-4 fill-white"></i>
          <span>儲存並「立即更新」新聞</span>
        </button>
        
        <button id="save-settings-only-btn" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2.5 rounded-xl transition flex items-center justify-center space-x-1.5 text-xs">
          <i data-lucide="check" class="w-3.5 h-3.5"></i>
          <span>僅儲存時間與主題設定</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 浮動 Toast 提示通知 -->
  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg transition-all duration-300 opacity-0 pointer-events-none flex items-center space-x-2">
    <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
    <span id="toast-msg">已成功更新！</span>
  </div>

  <footer class="mt-auto py-4 text-center text-slate-400 text-[11px]">
    由 Google Gemini 2.5 Flash × LINE LIFF 免費驅動
  </footer>

  <!-- 應用程式核心邏輯腳本 -->
  <script>
    // -------------------------------------------------------------
    // 設定區：Vercel 雲端部署會自動對應同網域的 /api 路徑
    // -------------------------------------------------------------
    const APP_CONFIG = {
      GAS_EXEC_URL: "", // 若留空，自動使用同網域的 Vercel /api 路由
      LIFF_ID: "",      // 填入 LINE Developers 的 LIFF ID
      DEFAULT_KEYWORDS: "具身機器人, 製造業 AI, 智慧工廠"
    };

    let currentUser = {
      userId: "demo_user",
      displayName: "訪客 (預覽模式)",
      pictureUrl: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80",
      keywords: APP_CONFIG.DEFAULT_KEYWORDS,
      pushTime: "08:00"
    };

    // 初始化頁面
    document.addEventListener("DOMContentLoaded", async () => {
      lucide.createIcons();
      initDateDisplay();
      loadSavedSettings();
      initUIListeners();
      await initLineLiff();
    });

    function initDateDisplay() {
      const today = new Date();
      const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
      document.getElementById('current-date').innerText = today.toLocaleDateString('zh-TW', options);
    }

    // 從本地快取恢復設定
    function loadSavedSettings() {
      try {
        const saved = localStorage.getItem("ai_news_user_settings");
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed.keywords) currentUser.keywords = parsed.keywords;
          if (parsed.pushTime) currentUser.pushTime = parsed.pushTime;
        }
      } catch (e) {
        console.warn("無法讀取本地設定:", e);
      }
      updateUIBadgeSettings();
    }

    function saveSettingsLocally() {
      try {
        localStorage.setItem("ai_news_user_settings", JSON.stringify({
          keywords: currentUser.keywords,
          pushTime: currentUser.pushTime
        }));
      } catch (e) {}
      updateUIBadgeSettings();
    }

    function updateUIBadgeSettings() {
      document.getElementById('display-push-time').innerText = currentUser.pushTime || "08:00";
      document.getElementById('custom-push-time').value = currentUser.pushTime || "08:00";
      renderKeywordsTags(currentUser.keywords);
    }

    // 顯示浮動 Toast
    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      toastMsg.innerText = message;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }

    // 初始化 LINE LIFF
    async function initLineLiff() {
      if (APP_CONFIG.LIFF_ID) {
        try {
          await liff.init({ liffId: APP_CONFIG.LIFF_ID });
          if (liff.isLoggedIn()) {
            const profile = await liff.getProfile();
            currentUser.userId = profile.userId;
            currentUser.displayName = profile.displayName;
            currentUser.pictureUrl = profile.pictureUrl || currentUser.pictureUrl;
          } else {
            liff.login();
            return;
          }
        } catch (err) {
          console.warn("LIFF 初始化跳過或失敗，切換為本地預覽模式:", err);
        }
      }

      // 更新畫面上的使用者資訊
      document.getElementById('user-name').innerText = currentUser.displayName;
      document.getElementById('user-avatar').src = currentUser.pictureUrl;

      // 載入該使用者的關鍵字與新聞資料
      await fetchUserDataAndNews();
    }

    // 向後端或即時 RSS 請求最新新聞
    async function fetchUserDataAndNews(forceRefresh = false) {
      showLoading(true);

      const isLocalFile = window.location.protocol === 'file:';
      
      // 1. 若設定了 GAS 或 Vercel API，優先向後端請求
      if (!isLocalFile && (APP_CONFIG.GAS_EXEC_URL || window.location.pathname.includes('/api/'))) {
        try {
          const userApiUrl = APP_CONFIG.GAS_EXEC_URL 
            ? `${APP_CONFIG.GAS_EXEC_URL}?action=getUserSettings&userId=${encodeURIComponent(currentUser.userId)}`
            : `/api/user-settings?userId=${encodeURIComponent(currentUser.userId)}`;

          const newsApiUrl = APP_CONFIG.GAS_EXEC_URL 
            ? `${APP_CONFIG.GAS_EXEC_URL}?action=getNews&userId=${encodeURIComponent(currentUser.userId)}`
            : `/api/news?userId=${encodeURIComponent(currentUser.userId)}`;

          const userRes = await fetch(userApiUrl);
          const userData = await userRes.json();
          if (userData.success && userData.keywords) {
            currentUser.keywords = userData.keywords;
          }

          const newsRes = await fetch(newsApiUrl);
          const newsData = await newsRes.json();

          if (newsData.success && newsData.data && newsData.data.length > 0) {
            renderNewsCards(newsData.data);
            updateUIBadgeSettings();
            showLoading(false);
            return;
          }
        } catch (err) {
          console.warn("後端 API 連線失敗，啟動即時 RSS 引擎備援:", err);
        }
      }

      // 2. 即時聯網檢索最新 Google News RSS
      try {
        const liveNews = await fetchLiveGoogleNewsRSS(currentUser.keywords);
        if (liveNews && liveNews.length > 0) {
          renderNewsCards(liveNews);
        } else {
          renderNewsCards(getMockNewsData());
        }
      } catch (e) {
        console.error("即時檢索錯誤，切換展示模式:", e);
        renderNewsCards(getMockNewsData());
      } finally {
        updateUIBadgeSettings();
        showLoading(false);
      }
    }

    // 前端即時抓取 Google News RSS 並生成繁中結構化洞察 (含 24h 最新與防重複過濾)
    async function fetchLiveGoogleNewsRSS(keywords) {
      const cleanKeywords = (keywords || APP_CONFIG.DEFAULT_KEYWORDS).trim();
      // 嚴格限定 24 小時內最新發布的新聞 (when:1d)
      const encodedQuery = encodeURIComponent(`${cleanKeywords} when:1d`);
      const rssTarget = `https://news.google.com/rss/search?q=${encodedQuery}&hl=zh-TW&gl=TW&ceid=TW:zh-Hant`;
      
      // 讀取本地已見過的新聞歷史庫以防重複
      let seenTitles = [];
      try {
        seenTitles = JSON.parse(localStorage.getItem("ai_news_seen_history") || "[]");
      } catch (e) {}

      // 策略 1: 透過高可靠的 rss2json 服務 (CORS Friendly)
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssTarget)}`;
      
      try {
        const res = await fetch(apiUrl);
        if (res.ok) {
          const json = await res.json();
          if (json.status === 'ok' && json.items && json.items.length > 0) {
            const freshItems = [];

            for (const item of json.items) {
              let title = item.title || "最新情報";
              let source = item.author || "焦點快訊";
              if (title.includes(' - ')) {
                const parts = title.split(' - ');
                source = parts.pop().trim();
                title = parts.join(' - ').trim();
              }

              // 排除重複新聞
              if (seenTitles.includes(title)) {
                continue;
              }

              freshItems.push({
                title: title,
                link: item.link || "https://news.google.com",
                source: source,
                pubDate: item.pubDate ? item.pubDate.split(' ')[0] : '今日最新',
                summary: `【今日最新】針對「${cleanKeywords}」最新動向：${title}。相關單位正密切關注最新進展。`,
                impact: `持續追蹤「${cleanKeywords}」領域之讀者，建議評估相關時程安排與後續市場反應。`
              });

              if (freshItems.length >= 5) break;
            }

            // 若全數過濾完後為空（代表今日新聞皆已看過），則保留最新 3 則供重複查閱
            const finalResults = freshItems.length > 0 ? freshItems : json.items.slice(0, 3).map(item => {
              let title = item.title || "最新情報";
              let source = item.author || "焦點快訊";
              if (title.includes(' - ')) {
                const parts = title.split(' - ');
                source = parts.pop().trim();
                title = parts.join(' - ').trim();
              }
              return {
                title: title,
                link: item.link || "https://news.google.com",
                source: source,
                pubDate: item.pubDate ? item.pubDate.split(' ')[0] : '今日最新',
                summary: `【今日最新】「${cleanKeywords}」最新報導：${title}。`,
                impact: `建議持續關注相關技術演進與產業趨勢。`
              };
            });

            // 更新已讀歷史庫（最多保留 50 筆）
            finalResults.forEach(r => {
              if (!seenTitles.includes(r.title)) seenTitles.push(r.title);
            });
            if (seenTitles.length > 50) seenTitles = seenTitles.slice(-50);
            try {
              localStorage.setItem("ai_news_seen_history", JSON.stringify(seenTitles));
              localStorage.setItem("ai_news_live_cache", JSON.stringify(finalResults));
            } catch (e) {}

            return finalResults;
          }
        }
      } catch (err) {
        console.warn("rss2json 抓取異常，嘗試備援代理:", err);
      }

      // 策略 2: 備援 CORS 代理
      try {
        const backupProxy = `https://corsproxy.io/?url=${encodeURIComponent(rssTarget)}`;
        const resBackup = await fetch(backupProxy);
        if (resBackup.ok) {
          const xmlText = await resBackup.text();
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(xmlText, "text/xml");
          const items = xmlDoc.querySelectorAll("item");
          if (items && items.length > 0) {
            const results = [];
            for (let i = 0; i < Math.min(items.length, 5); i++) {
              const item = items[i];
              let title = item.querySelector("title")?.textContent || "焦點情報";
              let source = item.querySelector("source")?.textContent || "熱門快報";
              if (title.includes(' - ')) {
                const parts = title.split(' - ');
                source = parts.pop().trim();
                title = parts.join(' - ').trim();
              }
              const link = item.querySelector("link")?.textContent || "https://news.google.com";
              results.push({
                title: title,
                link: link,
                source: source,
                pubDate: '今日即時',
                summary: `【即時情報】針對「${cleanKeywords}」最新消息：${title}。`,
                impact: `建議持續追蹤相關發展與最新消息。`
              });
            }
            localStorage.setItem("ai_news_live_cache", JSON.stringify(results));
            return results;
          }
        }
      } catch (e) {
        console.error("備援代理亦失敗:", e);
      }

      // 若都失敗但本地有之前快取的新聞，則優先顯示快取，絕不顯示機器人假資料
      const cached = localStorage.getItem("ai_news_live_cache");
      if (cached) {
        return JSON.parse(cached);
      }

      return null;
    }

    // UI 事件監聽
    function initUIListeners() {
      const modal = document.getElementById('settings-modal');
      const openBtn = document.getElementById('open-settings-btn');
      const closeBtn = document.getElementById('close-modal-btn');
      const customKeywordsInput = document.getElementById('custom-keywords');
      const customTimeInput = document.getElementById('custom-push-time');
      const instantUpdateBtn = document.getElementById('instant-update-btn');
      const saveAndRefreshBtn = document.getElementById('save-and-refresh-btn');
      const saveSettingsOnlyBtn = document.getElementById('save-settings-only-btn');

      // 打開設定
      openBtn.addEventListener('click', () => {
        customKeywordsInput.value = currentUser.keywords;
        customTimeInput.value = currentUser.pushTime || "08:00";
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      });

      // 關閉設定
      closeBtn.addEventListener('click', () => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      });

      // 點擊熱門關鍵字標籤快速加入
      document.querySelectorAll('.preset-tag').forEach(tagBtn => {
        tagBtn.addEventListener('click', () => {
          const tag = tagBtn.dataset.tag;
          let currentList = customKeywordsInput.value.split(/[,，\s]+/).filter(k => k.trim());
          if (!currentList.includes(tag)) {
            currentList.push(tag);
            customKeywordsInput.value = currentList.join(', ');
          }
        });
      });

      // 點擊快速時間標籤
      document.querySelectorAll('.time-preset-tag').forEach(timeBtn => {
        timeBtn.addEventListener('click', () => {
          document.querySelectorAll('.time-preset-tag').forEach(b => {
            b.classList.remove('bg-blue-100', 'text-blue-700', 'border-blue-300', 'font-bold');
            b.classList.add('bg-slate-100', 'text-slate-700', 'border-slate-200', 'font-medium');
          });
          timeBtn.classList.remove('bg-slate-100', 'text-slate-700', 'border-slate-200', 'font-medium');
          timeBtn.classList.add('bg-blue-100', 'text-blue-700', 'border-blue-300', 'font-bold');
          customTimeInput.value = timeBtn.dataset.time;
        });
      });

      // 立即更新函式
      const performInstantUpdate = async (isFromModal = false) => {
        const btn = isFromModal ? saveAndRefreshBtn : instantUpdateBtn;
        const originalContent = btn.innerHTML;
        
        btn.disabled = true;
        btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin text-blue-600"></i><span>更新中...</span>`;
        lucide.createIcons();

        if (isFromModal) {
          currentUser.keywords = customKeywordsInput.value.trim() || APP_CONFIG.DEFAULT_KEYWORDS;
          currentUser.pushTime = customTimeInput.value || "08:00";
          saveSettingsLocally();
          modal.classList.add('hidden');
          modal.classList.remove('flex');
        }

        showToast("⚡ 正在為您即時聯網檢索最新新聞...");

        await fetchUserDataAndNews(true);

        btn.disabled = false;
        btn.innerHTML = originalContent;
        lucide.createIcons();

        showToast("✅ 專屬新聞已即時更新完成！");
      };

      // 主畫面立即更新按鈕
      instantUpdateBtn.addEventListener('click', () => performInstantUpdate(false));

      // 彈窗內：儲存並立即更新新聞
      saveAndRefreshBtn.addEventListener('click', () => performInstantUpdate(true));

      // 彈窗內：僅儲存時間與主題設定
      saveSettingsOnlyBtn.addEventListener('click', () => {
        currentUser.keywords = customKeywordsInput.value.trim() || APP_CONFIG.DEFAULT_KEYWORDS;
        currentUser.pushTime = customTimeInput.value || "08:00";
        saveSettingsLocally();

        modal.classList.add('hidden');
        modal.classList.remove('flex');
        showToast(`✅ 設定已儲存（每日 ${currentUser.pushTime} 更新）`);
      });
    }

    function showLoading(isLoading) {
      const skeleton = document.getElementById('loading-skeleton');
      const listEl = document.getElementById('news-list');
      const emptyEl = document.getElementById('empty-state');
      if (isLoading) {
        skeleton.classList.remove('hidden');
        listEl.classList.add('hidden');
        emptyEl.classList.add('hidden');
      } else {
        skeleton.classList.add('hidden');
      }
    }
